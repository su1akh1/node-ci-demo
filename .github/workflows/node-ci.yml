name: Node.js CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Fix ESLint permissions
        run: chmod +x node_modules/.bin/eslint

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test